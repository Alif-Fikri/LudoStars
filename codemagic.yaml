workflows:
  quality-check:
    name: Quality check
    instance_type: linux_x2
    max_build_duration: 20
    environment:
      flutter: 3.41.7
      java: 17
    triggering:
      events:
        - pull_request
      cancel_previous_builds: true
    scripts:
      - name: Resolve dependencies
        script: flutter pub get
      - name: Analyze
        script: flutter analyze
      - name: Test
        script: flutter test

  android-release:
    name: Android release (AAB)
    instance_type: linux_x2
    max_build_duration: 60
    environment:
      flutter: 3.41.7
      java: 17
      android_signing:
        # Name of the keystore uploaded under Codemagic → Teams/App settings →
        # Code signing identities. Must match exactly.
        - ludostars_keystore
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'v*'
          include: true
    scripts:
      - name: Write key.properties
        # android/app/build.gradle.kts reads signing details from this file, and
        # it is gitignored, so CI has to recreate it from the keystore Codemagic
        # mounts for us.
        script: |
          cat > "$CM_BUILD_DIR/android/key.properties" <<EOF
          storeFile=$CM_KEYSTORE_PATH
          storePassword=$CM_KEYSTORE_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          keyPassword=$CM_KEY_PASSWORD
          EOF
      - name: Resolve dependencies
        script: flutter pub get
      - name: Analyze
        script: flutter analyze
      - name: Test
        script: flutter test
      - name: Build AAB
        # The version comes from pubspec.yaml on purpose; nothing here bumps it,
        # so a tag and its pubspec version have to be raised together.
        script: flutter build appbundle --release
      - name: Report signing certificate
        # Prints the fingerprint of whatever actually signed the bundle, so a
        # wrong-key upload is caught here instead of by Play.
        script: |
          AAB=$(find build -name '*.aab' | head -1)
          SIG=$(unzip -l "$AAB" | grep -oE 'META-INF/[^ ]+\.(RSA|DSA|EC)' | head -1)
          unzip -p "$AAB" "$SIG" | keytool -printcert | grep -E 'Owner:|SHA1:'
    artifacts:
      - build/**/outputs/bundle/**/*.aab
      - build/**/outputs/**/mapping.txt
    publishing:
      email:
        recipients:
          - fikritestings@gmail.com
        notify:
          success: true
          failure: true

      # Uploading straight to Play is intentionally left off. Enable it only
      # once the upload key is confirmed, and keep the track at `internal` —
      # publishing to production while a release is in review replaces the
      # pending release and restarts its review.
      #
      # google_play:
      #   credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
      #   track: internal
      #   submit_as_draft: true
